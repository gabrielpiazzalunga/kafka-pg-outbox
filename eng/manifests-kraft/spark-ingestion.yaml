apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-ingestion-ledger
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark-ingestion
  template:
    metadata:
      labels:
        app: spark-ingestion
    spec:
      containers:
        - name: ingestion
          image: spark-ingestion:v20
          imagePullPolicy: IfNotPresent
          env:
            - name: KAFKA_BOOTSTRAP
              value: "kafka:9092"
            - name: SCHEMA_REGISTRY_URL
              value: "http://schema-registry:8081"
            - name: AWS_REGION
              value: "us-east-1"
            - name: AWS_ACCESS_KEY_ID
              value: "minioadmin"
            - name: AWS_SECRET_ACCESS_KEY
              value: "minioadmin"
            - name: S3_ENDPOINT
              value: "http://minio:9000"
            - name: S3_ACCESS_KEY
              value: "minioadmin"
            - name: S3_SECRET_KEY
              value: "minioadmin"
            - name: JDBC_URL
              value: "jdbc:postgresql://postgres:5432/iceberg_catalog"
            - name: JDBC_USER
              value: "postgres"
            - name: JDBC_PASSWORD
              value: "postgres"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
