syntax = "proto3";

package oi.messaging.contracts;

import "shared/command_envelope.proto";
import "commands/params/pdu_command_params.proto";

option csharp_namespace = "OI.Messaging.Contracts.Proto";

// Hardware configuration command for a Power Distribution Unit outlet.
// Published on vessel.commands.pdu. Message key: payload_id.
message PDUCommand {
  CommandEnvelope envelope = 1;
  PDUCommandParams params = 2;
}
