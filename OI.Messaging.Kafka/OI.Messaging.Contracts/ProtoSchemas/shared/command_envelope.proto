syntax = "proto3";

package oi.messaging.contracts;

import "google/protobuf/timestamp.proto";

option csharp_namespace = "OI.Messaging.Contracts.Proto";

// Common fields present on all command messages. Embedded as the 'envelope' field
// in every {Type}Command message.
message CommandEnvelope {
  // Unique command identifier. Used for correlation with CommandResponse.
  string command_id = 1;

  string vessel_id = 2;

  // Target device identifier. Also used as the Kafka message key on command topics.
  string payload_id = 3;

  // Identity of the operator or system that issued the command.
  string issued_by = 4;

  // Timestamp when the command was issued onshore (UTC).
  google.protobuf.Timestamp issued_at = 5;
}
