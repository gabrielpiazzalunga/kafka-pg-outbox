syntax = "proto3";

package oi.messaging.contracts;

import "shared/reading_envelope.proto";

option csharp_namespace = "OI.Messaging.Contracts.Proto";

// Power Distribution Unit reading (e.g. CyberPower PDU via SNMP).
// Published on vessel.readings.pdu.
message PDUReading {
  ReadingEnvelope envelope = 1;

  // Input voltage in Volts.
  optional double voltage_v = 2;

  // Total load current in Amperes.
  optional double current_a = 3;

  // Total power consumption in Watts.
  optional double power_w = 4;

  // AC supply frequency in Hz.
  optional double frequency_hz = 5;

  // PDU unit name as reported by device.
  optional string unit_name = 6;

  // PDU network port name.
  optional string port_name = 7;

  // Physical rack location — e.g. PWR-10.
  optional string location = 8;

  // Management IP address of the PDU.
  optional string ip_address = 9;

  // Per-outlet state array. Absent when connection_status is DISCONNECTED or DEGRADED.
  repeated PDUOutlet outlets = 10;
}

// Per-outlet state and metering. outlet_index is the join key for topology evaluation.
message PDUOutlet {
  // Outlet number on the PDU. Join key against payload_topology_links.
  int32 outlet_index = 1;

  OutletState state = 2;

  // Per-outlet current draw in Amperes. Absent if PDU does not support per-outlet metering.
  optional double current_a = 3;
}

enum OutletState {
  OUTLET_STATE_UNSPECIFIED = 0;
  OUTLET_STATE_ON = 1;
  OUTLET_STATE_OFF = 2;
  OUTLET_STATE_LOCKED = 3;
}
