syntax = "proto3";

package oi.messaging.contracts;

import "google/protobuf/timestamp.proto";
import "shared/link_type.proto";
import "shared/link_status.proto";
import "shared/failure_reason.proto";

option csharp_namespace = "OI.Messaging.Contracts.Proto";

// Emitted by the Topology Health Reporter whenever a topology link changes status.
// One message per link per transition.
// Published on vessel.health.topology. Message key: vessel_id.
message TopologyHealthTransition {
  // Evaluation timestamp — when the Topology Health Reporter detected the transition (UTC).
  google.protobuf.Timestamp ts = 1;

  string vessel_id = 2;

  // The payload whose infrastructure link changed status.
  string payload_id = 3;

  LinkType link_type = 4;

  // Infrastructure device identifier — e.g. R-PWR-8 for a PDU, 192.168.1.50 for an endpoint.
  string device_id = 5;

  // Outlet index for PDU_OUTLET links. Absent for ENDPOINT links.
  optional string device_port = 6;

  LinkStatus previous_status = 7;
  LinkStatus current_status = 8;

  // Specific failure cause. Populated when current_status is FAIL.
  optional FailureReason reason = 9;

  // Timestamp of the payload_readings observation used to evaluate this link.
  // May lag ts by up to one evaluation interval.
  optional google.protobuf.Timestamp observed_at = 10;
}
