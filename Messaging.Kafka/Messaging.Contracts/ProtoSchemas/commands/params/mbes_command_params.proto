syntax = "proto3";

package oi.messaging.contracts;

option csharp_namespace = "Messaging.Contracts.Proto";

// Hardware configuration parameters for a Multibeam Echosounder command.
// All fields are optional — only specified fields are changed on the device.
message MBESCommandParams {
  // Operating frequency in kHz.
  optional double frequency_khz = 1;

  // Swath opening angle in degrees.
  optional double beam_angle_deg = 2;

  // Roll/pitch correction offset in degrees.
  optional double angle_correction_deg = 3;

  optional MBESOperatingMode operating_mode = 4;

  optional MBESPowerLevel power_level = 5;
}

enum MBESOperatingMode {
  MBES_OPERATING_MODE_UNSPECIFIED = 0;
  MBES_OPERATING_MODE_NORMAL = 1;
  MBES_OPERATING_MODE_DEEP = 2;
  MBES_OPERATING_MODE_SHALLOW = 3;
}

enum MBESPowerLevel {
  MBES_POWER_LEVEL_UNSPECIFIED = 0;
  MBES_POWER_LEVEL_LOW = 1;
  MBES_POWER_LEVEL_MEDIUM = 2;
  MBES_POWER_LEVEL_HIGH = 3;
}
